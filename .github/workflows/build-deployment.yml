name: build-artifacts
on:
  push:
    branches:
      - master

jobs:
  non-conditional-step-to-make-this-valid:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Github actions need a step without any conditions"

  build_and_deploy:
    timeout-minutes: 10
    if: "!contains(github.event.head_commit.message, 'NO_DEPLOY')"
    environment:
      name: production
    defaults:
      run:
        working-directory: .
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_ENV: production
      AWS_DEFAULT_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node setup
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Terraform setup
        uses: hashicorp/setup-terraform@v4

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build website
        run: npm run build

      - name: Terraform Init
        run: |
          cd ./terraform
          terraform init
          terraform workspace select ${DEPLOYMENT_ENV}
          terraform get

      - name: Terraform Validate
        run: |
          cd ./terraform
          terraform validate     

      - name: Terraform Plan
        run: |
          cd ./terraform
          terraform plan \
            -var profile=pipeline \
            -var domain_name=${{ vars.AWS_FULL_DOMAIN }} \
            -var hosted_zone_id=${{ secrets.AWS_HOSTED_ZONE }} \
            -var cert_arn=${{secrets.DOSAKI_NET_CERT_ARN}}

      - name: Terraform Apply
        run: |
          cd ./terraform
          terraform apply -auto-approve -input=false \
            -var profile=pipeline \
            -var domain_name=${{ vars.AWS_FULL_DOMAIN }} \
            -var hosted_zone_id=${{ secrets.AWS_HOSTED_ZONE }} \
            -var cert_arn=${{secrets.DOSAKI_NET_CERT_ARN}}
