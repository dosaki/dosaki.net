name: build-artifacts
on:
  push:
    branches:
      - master

# Merging several PRs back to back queues several deploys. Without this they
# run in parallel and race each other on the Terraform state and the S3 sync.
# Queue them instead; a running deploy is left to finish, and only the newest
# pending one is kept since it already contains the older commits.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  non-conditional-step-to-make-this-valid:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Github actions need a step without any conditions"

  build_and_deploy:
    # Leaves room for the CloudFront invalidation waiter, which gives up
    # after 10 minutes on its own.
    timeout-minutes: 20
    if: "!contains(github.event.head_commit.message, 'NO_DEPLOY')"
    environment:
      name: production
    defaults:
      run:
        working-directory: .
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_ENV: production
      AWS_DEFAULT_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node setup
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Terraform setup
        uses: hashicorp/setup-terraform@v4
        with:
          # The wrapper adds its own lines to stdout, which breaks
          # $(terraform output -raw ...) in the invalidation step.
          terraform_wrapper: false

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build website
        run: npm run build

      - name: Terraform Init
        run: |
          cd ./terraform
          terraform init
          terraform workspace select ${DEPLOYMENT_ENV}
          terraform get

      - name: Terraform Validate
        run: |
          cd ./terraform
          terraform validate     

      - name: Terraform Plan
        run: |
          cd ./terraform
          terraform plan \
            -var profile=pipeline \
            -var domain_name=${{ vars.AWS_FULL_DOMAIN }} \
            -var hosted_zone_id=${{ secrets.AWS_HOSTED_ZONE }} \
            -var cert_arn=${{secrets.DOSAKI_NET_CERT_ARN}}

      - name: Terraform Apply
        run: |
          cd ./terraform
          terraform apply -auto-approve -input=false \
            -var profile=pipeline \
            -var domain_name=${{ vars.AWS_FULL_DOMAIN }} \
            -var hosted_zone_id=${{ secrets.AWS_HOSTED_ZONE }} \
            -var cert_arn=${{secrets.DOSAKI_NET_CERT_ARN}}

      # Edge locations keep their own copy of index.html and of the index.html
      # served for client-side routes. Clear them so every location picks up
      # the new build at once, rather than pointing at bundles apply deleted.
      # Wait for it, so a green run means every location serves the new build.
      - name: Invalidate CloudFront cache
        run: |
          cd ./terraform
          DISTRIBUTION_ID=$(terraform output -raw distribution_id)
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "Waiting for invalidation $INVALIDATION_ID"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"
