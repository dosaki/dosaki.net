name: verify
on:
  pull_request:
  push:
    branches-ignore:
      - master
      # Dependabot pushes its branch and opens the PR moments later, so both
      # triggers fire for the same commit and the suite runs twice.
      - "dependabot/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
